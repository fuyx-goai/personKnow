http_addr: ":8080"
vector_store: mem

database:
  # 留空即以 standalone 模式启动，不连接 PostgreSQL。
  url: ""
  max_conns: 10

auth:
  jwt_secret: ""
  identity_secret: ""
  access_ttl: "15m"
  refresh_ttl: "720h"
  wechat_app_id: ""
  wechat_app_secret: ""

storage:
  data_dir: data
  max_file_bytes: 52428800

worker:
  concurrency: 2
  lease: "5m"
  poll: "1s"

log:
  dir: logs
  max_size_mb: 100
  retain_days: 30

llm:
  api_key: ""
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  chat_model: "doubao-seed-2-1-lite-260915"
  embed_model: "doubao-embedding-vision-251215"
  embed_api: "ark_multimodal"

milvus:
  address: "127.0.0.1:19530"
  username: "root"
  password: ""
  db_name: "default"
  collection: "eino_knowledge"
  dim: 2048
  metric: "COSINE"
